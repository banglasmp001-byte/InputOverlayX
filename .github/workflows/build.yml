name: Build InputOverlayX

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: Build MC ${{ matrix.minecraft_version }}
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft_version: "1.21.1"
            yarn_mappings: "1.21.1+build.3"
            loader_version: "0.16.9"
            loom_version: "1.9-SNAPSHOT"
            use_mojang_mappings: "false"
            cloth_config_version: "15.0.140"
            modmenu_version: "11.0.3"

          - minecraft_version: "1.21.2"
            yarn_mappings: "1.21.2+build.1"
            loader_version: "0.16.9"
            loom_version: "1.9-SNAPSHOT"
            use_mojang_mappings: "false"
            cloth_config_version: "15.0.140"
            modmenu_version: "12.0.0"

          - minecraft_version: "1.21.3"
            yarn_mappings: "1.21.3+build.2"
            loader_version: "0.16.9"
            loom_version: "1.9-SNAPSHOT"
            use_mojang_mappings: "false"
            cloth_config_version: "15.0.140"
            modmenu_version: "12.0.0"

          - minecraft_version: "1.21.4"
            yarn_mappings: "1.21.4+build.8"
            loader_version: "0.16.9"
            loom_version: "1.9-SNAPSHOT"
            use_mojang_mappings: "false"
            cloth_config_version: "15.0.140"
            modmenu_version: "13.0.0"

          - minecraft_version: "1.21.5"
            yarn_mappings: "1.21.5+build.1"
            loader_version: "0.16.9"
            loom_version: "1.10-SNAPSHOT"
            use_mojang_mappings: "false"
            cloth_config_version: "15.0.140"
            modmenu_version: "13.0.0"

          - minecraft_version: "1.21.6"
            yarn_mappings: "1.21.6+build.1"
            loader_version: "0.16.9"
            loom_version: "1.10-SNAPSHOT"
            use_mojang_mappings: "false"
            cloth_config_version: "15.0.140"
            modmenu_version: "14.0.0"

          - minecraft_version: "1.21.7"
            yarn_mappings: "1.21.7+build.1"
            loader_version: "0.16.9"
            loom_version: "1.10-SNAPSHOT"
            use_mojang_mappings: "false"
            cloth_config_version: "15.0.140"
            modmenu_version: "14.0.0"

          - minecraft_version: "1.21.8"
            yarn_mappings: "1.21.8+build.1"
            loader_version: "0.16.9"
            loom_version: "1.10-SNAPSHOT"
            use_mojang_mappings: "false"
            cloth_config_version: "15.0.140"
            modmenu_version: "14.0.0"

          - minecraft_version: "1.21.9"
            yarn_mappings: ""
            loader_version: "0.16.9"
            loom_version: "1.10-SNAPSHOT"
            use_mojang_mappings: "true"
            cloth_config_version: "15.0.140"
            modmenu_version: "14.0.0"

          - minecraft_version: "1.21.10"
            yarn_mappings: ""
            loader_version: "0.16.9"
            loom_version: "1.10-SNAPSHOT"
            use_mojang_mappings: "true"
            cloth_config_version: "15.0.140"
            modmenu_version: "14.0.0"

          - minecraft_version: "1.21.11"
            yarn_mappings: ""
            loader_version: "0.16.9"
            loom_version: "1.10-SNAPSHOT"
            use_mojang_mappings: "true"
            cloth_config_version: "15.0.140"
            modmenu_version: "14.0.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
          cache-read-only: false

      - name: Resolve latest Fabric API version
        id: fabric
        run: |
          MC="${{ matrix.minecraft_version }}"
          METADATA=$(curl -sf "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml" || echo "")
          VERSION=$(echo "$METADATA" | grep -o "<version>[^<]*+${MC}<\/version>" | sed 's/<[^>]*>//g' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not find fabric-api version for MC $MC"
            exit 1
          fi
          echo "Found fabric-api: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Cache Gradle Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/loom-cache
            .gradle/loom-cache
          key: ${{ runner.os }}-loom-${{ matrix.minecraft_version }}-${{ hashFiles('build.gradle', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-loom-${{ matrix.minecraft_version }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          ./gradlew build \
            -Pminecraft_version=${{ matrix.minecraft_version }} \
            -Pyarn_mappings="${{ matrix.yarn_mappings }}" \
            -Ploader_version=${{ matrix.loader_version }} \
            -Pfabric_version=${{ steps.fabric.outputs.version }} \
            -Ploom_version=${{ matrix.loom_version }} \
            -Puse_mojang_mappings=${{ matrix.use_mojang_mappings }} \
            -Pcloth_config_version=${{ matrix.cloth_config_version }} \
            -Pmodmenu_version=${{ matrix.modmenu_version }} \
            --no-daemon \
            --stacktrace

      - name: Locate and rename JAR
        if: success()
        run: |
          mkdir -p artifacts
          JAR=$(find build/libs -name "*.jar" ! -name "*-sources*" | head -n 1)
          if [ -z "$JAR" ]; then
            echo "ERROR: No JAR found in build/libs"
            exit 1
          fi
          echo "Found JAR: $JAR"
          cp "$JAR" "artifacts/InputOverlayX-${{ matrix.minecraft_version }}.jar"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: InputOverlayX-${{ matrix.minecraft_version }}
          path: artifacts/InputOverlayX-${{ matrix.minecraft_version }}.jar
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "## InputOverlayX Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the individual version job results above for per-version build status." >> $GITHUB_STEP_SUMMARY
          echo "Each version JAR is available as a separate downloadable artifact." >> $GITHUB_STEP_SUMMARY
